plugins {
    id "com.android.application"
    // AGP 9.0+ sudah menyertakan dukungan Kotlin bawaan — plugin
    // kotlin-android TIDAK BOLEH diterapkan lagi (build gagal bila ada).
    // The Flutter Gradle Plugin must be applied after the Android Gradle plugin.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "id.prasmanan.petalaut"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Java 17: AGP 9.0+ / Kotlin 2.4 menarget JVM 17 (toolchain JDK 17);
        // target 1.8 membuat ':app:compileReleaseKotlin' gagal
        // ("Inconsistent JVM Target Compatibility", run #12: Java 1.8 vs
        // Kotlin 17). Kotlin TIDAK mengikuti compileOptions ini — ia
        // memakai toolchain JDK — jadi Java harus disamakan ke 17.
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // Desugaring: flutter_local_notifications memakai API java.time
        // yang baru ada di API 26+; minSdk 24 butuh desugaring agar
        // kelas-kelas itu tersedia di Android 7–8.
        coreLibraryDesugaringEnabled = true
    }

    // (Blok kotlinOptions DIHAPUS: metode itu milik plugin kotlin-android
    // yang dilarang di AGP 9.0+. Koreksi S-28: asumsi S-21 bahwa target JVM
    // Kotlin "mengikuti compileOptions" SALAH — log run #12 membuktikan
    // Kotlin memakai toolchain JDK 17 sementara Java 1.8, dan build gagal.
    // Yang disamakan adalah Java (compileOptions di atas -> 17), bukan Kotlin.)

    defaultConfig {
        applicationId = "id.prasmanan.petalaut"
        // minSdk 24 (Android 7.0): di atas minimum semua plugin yang dipakai
        // (geolocator, permission_handler, flutter_secure_storage).
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO (sebelum Play Store): buat keystore release sendiri +
            // signingConfigs.release (lihat skill flutter-app-engineering §12).
            // Untuk sideload CI saat ini, release ditandatangani kunci debug
            // (pola template standar) agar APK langsung bisa diinstal.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
