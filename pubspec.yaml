name: peta_laut
description: >-
  Peta Laut — chart laut pribadi untuk perairan Indonesia.
  Peta interaktif, GPS, pasang surut, cuaca BMKG, gelombang,
  kedalaman GEBCO, dan AIS kapal. Semua data gratis.
publish_to: none
version: 1.1.0+2

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.27.0'

# Versi minimum di bawah ini DIVERIFIKASI ADA di pub.dev pada 21 Nov 2026
# (flutter_map 8.3.2, geolocator 14.1.2, permission_handler 13.0.2,
# drift 2.35.4, fl_chart 1.3.1, flutter_secure_storage 11.2.0,
# flutter_compass 0.8.1, flutter_local_notifications 19.4.2).
# Caret (^) membiarkan pub memilih patch/minor terbaru dalam major
# yang sama.
dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.0
  fl_chart: ^1.3.0
  flutter_compass: ^0.8.0
  flutter_local_notifications: ^19.4.2
  flutter_map: ^8.3.2
  flutter_secure_storage: ^11.0.0
  geolocator: ^14.1.0
  http: ^1.5.0
  latlong2: ^0.9.1
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^13.0.0
  provider: ^6.1.2
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  build_runner: ^2.6.0
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/peta-laut-logo.webp
